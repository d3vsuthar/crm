<style>
/* Layout: a stack of screenshot-ready frames, one journey each, drawn like a flow-builder canvas; same palette and type as the portfolio page */
:root {
  --paper: #f3f4f1; --surface: #fbfbf9; --canvas: #eef0ec; --ink: #1a1c22; --muted: #5b606b; --line: #d9dbd6;
  --edge: #8b909b; --accent: #3740b8; --accent-soft: #e4e5f6; --email: #0f7a6c; --email-soft: #dcf0ec;
  --split: #9a6206; --split-soft: #f8ecd6; --store: #8a3a6e; --store-soft: #f5e3ee; --mark: #fff1a8; --mark-ink: #4a3d00;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121318; --surface: #1a1c23; --canvas: #16181e; --ink: #e8e9ee; --muted: #9a9fac; --line: #2c2f39;
  --edge: #6b7080; --accent: #9aa2ff; --accent-soft: #23264a; --email: #5fd1bf; --email-soft: #15332f;
  --split: #e8b45a; --split-soft: #3a2c12; --store: #e79ccb; --store-soft: #3a1d30; --mark: #4a4210; --mark-ink: #fbe98a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121318; --surface: #1a1c23; --canvas: #16181e; --ink: #e8e9ee; --muted: #9a9fac; --line: #2c2f39;
  --edge: #6b7080; --accent: #9aa2ff; --accent-soft: #23264a; --email: #5fd1bf; --email-soft: #15332f;
  --split: #e8b45a; --split-soft: #3a2c12; --store: #e79ccb; --store-soft: #3a1d30; --mark: #4a4210; --mark-ink: #fbe98a; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; max-width: 72ch; }
.tag { font: 500 0.72rem/1.2 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.note { font: 0.8rem/1.45 var(--mono); background: var(--mark); color: var(--mark-ink); padding: 8px 12px; border-radius: 4px; }
header { display: grid; gap: 12px; }

.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 24px 18px; display: grid; gap: 14px; }
.frame-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 24px; }
.frame-head > div { display: grid; gap: 4px; min-width: 0; }
.frame-head p { color: var(--muted); font-size: 0.95rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.04em; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.goal { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.chip.blue { border-color: transparent; background: var(--ink); color: var(--paper); }
.canvas { overflow-x: auto; background: var(--canvas); border-radius: 8px;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; }
.canvas svg { display: block; margin: 0 auto; width: 100%; height: auto; min-width: 760px; }
.foot { font-size: 0.88rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 0.76rem var(--mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* svg parts */
.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.arrow { fill: var(--edge); }
.elabel { font: 600 11px var(--mono); fill: var(--split); }
.n-trigger { fill: var(--accent); }
.t-trigger, .t-goal { fill: var(--paper); }
.t-trigger-sub, .t-goal-sub { fill: var(--paper); opacity: 0.85; }
.n-split { fill: var(--split-soft); stroke: var(--split); stroke-width: 1.4; }
.t-split { fill: var(--split); }
.n-msg { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.n-wait { fill: var(--canvas); stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 4 3; }
.t-wait { fill: var(--muted); }
.n-hold { fill: var(--canvas); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
.n-goal { fill: var(--ink); }
.n-stage { fill: var(--ink); }
.t-stage { fill: var(--paper); }
.n-journey { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.n-band { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 5 4; }
.t-band { fill: var(--accent); }
.c-push { fill: var(--accent-soft); } .ct-push { fill: var(--accent); }
.c-email { fill: var(--email-soft); } .ct-email { fill: var(--email); }
.c-store { fill: var(--store-soft); } .ct-store { fill: var(--store); }
.lbl { font: 700 13px var(--display); fill: var(--ink); }
.sub { font: 400 11.5px var(--body); fill: var(--muted); }
.lane { font: 600 10.5px var(--mono); letter-spacing: 0.1em; fill: var(--muted); }
.chiptxt { font: 600 9.5px var(--mono); letter-spacing: 0.06em; }
.kicker { font: 600 9.5px var(--mono); letter-spacing: 0.08em; }

/* workflow-builder look (capstone) */
.b-card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.b-card-trig { stroke: var(--accent); stroke-width: 1.6; }
.b-card-goal { stroke: var(--ink); stroke-width: 1.6; }
.shadow { flood-color: var(--ink); flood-opacity: 0.08; }
.b-edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.b-pill { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.b-pilltxt { font: 600 10.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.b-plus { fill: var(--surface); stroke: var(--edge); stroke-width: 1.2; }
.b-plusg { stroke: var(--edge); stroke-width: 1.4; fill: none; }
.b-exit { fill: var(--canvas); stroke: var(--edge); stroke-width: 1.2; }
.b-exittxt { font: 600 11px var(--mono); fill: var(--muted); text-anchor: middle; }
.b-loop { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
.b-looptxt { font: 600 11px var(--mono); fill: var(--accent); text-anchor: middle; }
.b-type { font: 600 9.5px var(--mono); letter-spacing: 0.07em; fill: var(--muted); }
.b-title { font: 700 14px var(--display); fill: var(--ink); }
.b-sub { font: 400 11.5px var(--body); fill: var(--muted); }
.glyph { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.glyph.fillg { fill: currentColor; stroke: none; }
.b-trig { fill: var(--accent); color: var(--paper); }
.b-split { fill: var(--split-soft); color: var(--split); }
.b-hold { fill: var(--canvas); color: var(--muted); }
.b-person { fill: var(--split-soft); color: var(--split); }
.b-push { fill: var(--accent-soft); color: var(--accent); }
.b-email { fill: var(--email-soft); color: var(--email); }
.b-wait { fill: var(--canvas); color: var(--muted); }
.b-goal { fill: var(--ink); color: var(--paper); }
.b-store { fill: var(--store-soft); color: var(--store); }
#capstone .canvas svg { min-width: 900px; }
</style>

    <div class="tag"><a href="index.html" style="color:inherit">← Selected CRM work</a> · Journey maps</div>
    <h1>Always-on CRM journeys</h1>

<script>
const SIZE = { trigger:{w:164,h:64}, split:{w:160,h:66}, msg:{w:164,h:74}, wait:{w:66,h:38}, hold:{w:164,h:56},
  goal:{w:140,h:58}, stage:{w:156,h:48}, journey:{w:156,h:64} };
const PERSONALISE = "market · gender ·|language · channel";

const DIAGRAMS = [
  { id: "capstone", builder: true, title: "One customer lifecycle, start to finish", sub: "How the individual journeys connect into a single programme, from the first visit to loyal client, and back again if they drift away.",
    chips: [{t:"Blueprint", blue:true}, {t:"Decisions: market · gender · language · channel · value"}],
    foot: "↺ Customers who come back through a win-back message rejoin the browsing journeys. Any new purchase starts the post-purchase steps again.",
    nodes: [
      {id:"t",   k:"trigger", c:1.5, l:0,  w:280, type:"Trigger", title:"Person joins", sub:"Signs up or installs the app"},
      {id:"pe",  k:"person",  c:1.5, l:1,  w:280, type:"Personalise", title:"Personalise", sub:"Market · gender · language · channel"},
      {id:"on",  k:"push",    c:1.5, l:2,  type:"Push series", title:"Onboarding", sub:"Welcome, services, picks"},
      {id:"hs",  k:"split",   c:1.5, l:3,  type:"Random split", title:"Holdout check", sub:"A random share skips reminders"},
      {id:"ho",  k:"hold",    c:3,   l:3,  type:"Holdout", title:"No reminders", sub:"Measures the journeys' lift"},
      {id:"ms",  k:"split",   c:1.5, l:4,  type:"Multi-split", title:"What do they do next?", sub:"Based on their last action"},
      {id:"r1",  k:"push",    c:0,   l:5,  type:"Push series", title:"Product reminders", sub:"The product they viewed"},
      {id:"r2",  k:"push",    c:1,   l:5,  type:"Push series", title:"Wishlist reminders", sub:"Items they saved"},
      {id:"r3",  k:"email",   c:2,   l:5,  type:"Email + push", title:"Bag reminders", sub:"Items left in the bag"},
      {id:"wq",  k:"wait",    c:3,   l:5,  type:"Wait", title:"Give it time", sub:"No activity yet"},
      {id:"rc",  k:"email",   c:3,   l:6,  type:"Email", title:"Recommendations", sub:"Brands they'll likely love"},
      {id:"g",   k:"goal",    c:1.5, l:7,  w:280, type:"Conversion goal", title:"First purchase", sub:"Buyers move on to the next stage"},
      {id:"pp",  k:"email",   c:1.5, l:8,  type:"Email", title:"Post-purchase", sub:"Order care and styling"},
      {id:"wt",  k:"wait",    c:1.5, l:9,  type:"Wait", title:"Let the order land", sub:"Delivery plus a few days"},
      {id:"tf",  k:"split",   c:1.5, l:10, type:"True / false branch", title:"Top-tier customer?", sub:"Spend and frequency"},
      {id:"vp",  k:"store",   c:0.5, l:11, type:"Task · store team", title:"VIP hand-off", sub:"Personal shopper calls"},
      {id:"ps",  k:"email",   c:0.5, l:12, type:"Email", title:"Private sale invites", sub:"Early access"},
      {id:"rp",  k:"email",   c:2.5, l:11, type:"Email series", title:"Repeat and cross-sell", sub:"New in from brands they buy"},
      {id:"gq",  k:"split",   c:1.5, l:13, type:"True / false branch", title:"Gone quiet?", sub:"No visit or order lately"},
      {id:"wb",  k:"push",    c:0.5, l:14, type:"Push + email", title:"Win-back", sub:"New in, private offers"},
      {id:"lp",  k:"loop",    c:0.5, l:15, title:"Back to browsing journeys"},
      {id:"x2",  k:"exit",    c:2.5, l:14, title:"Stays in programme"}
    ],
    edges: [["t","pe"],["pe","on"],["on","hs"],["hs","ho","Holdout"],["hs","ms","Everyone else"],
      ["ms","r1","Browses"],["ms","r2","Saves"],["ms","r3","Adds to bag"],["ms","wq","Nothing yet"],["wq","rc"],
      ["r1","g",null,1],["r2","g",null,1],["r3","g",null,1],["rc","g",null,1],
      ["g","pp"],["pp","wt"],["wt","tf"],["tf","vp","Yes"],["tf","rp","No"],["vp","ps"],["ps","gq",null,1],["rp","gq",null,1],
      ["gq","wb","Yes"],["gq","x2","No"],["wb","lp"]] },

  { id: "lifecycle", title: "Journeys across the customer lifecycle", sub: "Each journey starts from something the customer does on the site or app.",
    chips: [{t:"Email + push"}, {t:"English + Arabic"}], rowH: 104,
    nodes: [
      {id:"s1", t:"stage", c:0, r:0, l:"New customer"}, {id:"s2", t:"stage", c:1, r:0, l:"Browsing"},
      {id:"s3", t:"stage", c:2, r:0, l:"Considering"}, {id:"s4", t:"stage", c:3, r:0, l:"Ready to buy"},
      {id:"s5", t:"stage", c:4, r:0, l:"Brand building"},
      {id:"j1", t:"journey", c:0, r:1, l:"Onboarding", s:"Welcome, services,|categories for you"},
      {id:"j2", t:"journey", c:1, r:1, l:"Product to bag", s:"Viewed, didn't add"},
      {id:"j3", t:"journey", c:2, r:1, l:"Wishlist to bag", s:"Saved, didn't add"},
      {id:"j4", t:"journey", c:3, r:1, l:"Abandoned bag", s:"In the bag,|no checkout"},
      {id:"j5", t:"journey", c:4, r:1, l:"Own brands", s:"Awareness, then|first purchase"},
      {id:"b1", t:"band", c:1, c2:3, r:2, l:"Moments: fast-delivery cities · sale periods (wishlist → bag → checkout)"}
    ],
    edges: [["s1","s2"],["s2","s3"],["s3","s4"],["s4","s5"],["s1","j1"],["s2","j2"],["s3","j3"],["s4","j4"],["s5","j5"]] },

  { id: "ptc", title: "Product to bag", sub: "For people who look at a product but don't add it. Reminders build up over several touches, then switch to email.",
    chips: [{t:"Goal: adds to bag, then buys", goal:true}],
    nodes: [
      {id:"t", t:"trigger", c:0, r:0, l:"Viewed a product", s:"Didn't add it to the bag"},
      {id:"sp", t:"split", c:1, r:0, l:"Personalise", s:PERSONALISE},
      {id:"p1", t:"msg", ch:"push", c:2, r:0, l:"Reminder 1", s:"The product they viewed"},
      {id:"w1", t:"wait", c:3, r:0},
      {id:"p2", t:"msg", ch:"push", c:4, r:0, l:"Reminder 2", s:"Second nudge"},
      {id:"w2", t:"wait", c:5, r:0},
      {id:"p3", t:"msg", ch:"push", c:6, r:0, l:"Reminder 3", s:"Final push"},
      {id:"e1", t:"msg", ch:"email", c:7, r:0, l:"Email follow-up", s:"Product and similar picks"}
    ],
    edges: [["t","sp"],["sp","p1"],["p1","w1"],["w1","p2"],["p2","w2"],["w2","p3"],["p3","e1"]] },

  { id: "wtc", title: "Wishlist to bag", sub: "Brings people back to items they saved but never added to the bag.",
    chips: [{t:"Goal: adds to bag", goal:true}],
    nodes: [
      {id:"t", t:"trigger", c:0, r:0, l:"Saved to wishlist", s:"Not added to the bag"},
      {id:"sp", t:"split", c:1, r:0, l:"Personalise", s:PERSONALISE},
      {id:"p1", t:"msg", ch:"push", c:2, r:0, l:"Reminder 1", s:"Your saved item"},
      {id:"w1", t:"wait", c:3, r:0},
      {id:"p2", t:"msg", ch:"push", c:4, r:0, l:"Reminder 2", s:"Still in your wishlist"},
      {id:"w2", t:"wait", c:5, r:0},
      {id:"p3", t:"msg", ch:"push", c:6, r:0, l:"Reminder 3", s:"Last reminder"},
      {id:"e1", t:"msg", ch:"email", c:7, r:0, l:"Email", s:"All saved items"}
    ],
    edges: [["t","sp"],["sp","p1"],["p1","w1"],["w1","p2"],["p2","w2"],["w2","p3"],["p3","e1"]] },

  { id: "cart", title: "Abandoned bag", sub: "Items left in the bag trigger a reminder by push and by email.",
    chips: [{t:"Goal: starts checkout", goal:true}],
    nodes: [
      {id:"t", t:"trigger", c:0, r:0.5, l:"Left items in the bag", s:"Didn't check out"},
      {id:"sp", t:"split", c:1, r:0.5, l:"Personalise", s:PERSONALISE},
      {id:"pg", t:"msg", ch:"push", c:2, r:0, l:"Bag reminder", s:"What's waiting in the bag"},
      {id:"eg", t:"msg", ch:"email", c:2, r:1, l:"Bag email", s:"Items, sizes, delivery"}
    ],
    edges: [["t","sp"],["sp","pg"],["sp","eg"]] },

  { id: "onb", title: "Onboarding", sub: "New app users get a welcome, then reasons to shop with us, then the categories they're likely to want.",
    chips: [{t:"Goal: first purchase", goal:true}],
    nodes: [
      {id:"t", t:"trigger", c:0, r:0, l:"New app user", s:"First open of the app"},
      {id:"sp", t:"split", c:1, r:0, l:"Personalise", s:"market · gender"},
      {id:"wg", t:"msg", ch:"push", c:2, r:0, l:"Welcome", s:"Women's or men's"},
      {id:"w1", t:"wait", c:3, r:0},
      {id:"usp", t:"msg", ch:"push", c:4, r:0, l:"Why shop with us", s:"Services in their market"},
      {id:"w2", t:"wait", c:5, r:0},
      {id:"cat", t:"msg", ch:"push", c:6, r:0, l:"Categories for you", s:"Based on what they like"}
    ],
    edges: [["t","sp"],["sp","wg"],["wg","w1"],["w1","usp"],["usp","w2"],["w2","cat"]] }
];

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, str, cls, anchor = "middle") { const t = el("text", { x, y, class: cls, "text-anchor": anchor }, parent); t.textContent = str; return t; }
function lines(parent, cx, y, s, cls, lh = 14, anchor = "middle") { (s || "").split("|").forEach((ln, i) => text(parent, cx, y + i * lh, ln, cls, anchor)); }

function render(d) {
  const pad = 28, rowH = d.rowH || 112, gapAfter = c => (d.gaps && d.gaps[c]) || 34;
  const placed = d.nodes.filter(n => n.t !== "lane");
  const colW = {};
  placed.forEach(n => { if (n.t !== "band") colW[n.c] = Math.max(colW[n.c] || 0, SIZE[n.t].w); });
  const colX = {}; let x = pad;
  Object.keys(colW).map(Number).sort((a, b) => a - b).forEach(c => { colX[c] = x; x += colW[c] + gapAfter(c); });
  const lastCol = Math.max(...Object.keys(colW).map(Number));
  const W = x - gapAfter(lastCol) + pad;
  const maxR = Math.max(...placed.map(n => n.r));
  const H = pad * 2 + maxR * rowH + 80;

  const pos = {};
  placed.forEach(n => {
    let w, h;
    if (n.t === "band") { w = colX[n.c2] + colW[n.c2] - colX[n.c]; h = 44; }
    else ({ w, h } = SIZE[n.t]);
    const cy = pad + 40 + n.r * rowH;
    const left = n.t === "band" ? colX[n.c] : colX[n.c] + (colW[n.c] - w) / 2;
    pos[n.id] = { x: left, y: cy - h / 2, w, h, cx: left + w / 2, cy };
  });

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": d.title });
  svg.style.maxWidth = W + "px";
  const defs = el("defs", {}, svg);
  const m = el("marker", { id: `ar-${d.id}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", class: "arrow" }, m);

  d.nodes.filter(n => n.t === "lane").forEach(n => text(svg, W - pad, pad + 40 + n.r * rowH, n.l, "lane", "end"));

  const eg = el("g", {}, svg);
  d.edges.forEach(([a, b, label]) => {
    const A = pos[a], B = pos[b]; let p;
    if (B.x >= A.x + A.w - 1) {
      const x1 = A.x + A.w, y1 = A.cy, x2 = B.x - 2, y2 = B.cy, mid = x1 + Math.min(18, (x2 - x1) / 2);
      p = Math.abs(y1 - y2) < 1 ? `M${x1},${y1} H${x2}` : `M${x1},${y1} H${mid} V${y2} H${x2}`;
      if (label) text(eg, Math.abs(y1 - y2) < 1 ? x1 + 8 : mid + 6, y2 - 7, label, "elabel", "start");
    } else {
      const y1 = A.y + A.h, y2 = B.y - 2;
      if (Math.abs(A.cx - B.cx) < 1) p = `M${A.cx},${y1} V${y2}`;
      else { const midY = (y1 + y2) / 2; p = `M${A.cx},${y1} V${midY} H${B.cx} V${y2}`; }
      if (label) text(eg, A.cx + 7, (y1 + y2) / 2 + 4, label, "elabel", "start");
    }
    el("path", { d: p, class: "edge", "marker-end": `url(#ar-${d.id})` }, eg);
  });

  placed.forEach(n => {
    const P = pos[n.id], g = el("g", {}, svg);
    if (n.t === "trigger") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: P.h / 2, class: "n-trigger" }, g);
      text(g, P.cx, P.y + 18, "WHEN", "kicker t-trigger-sub");
      text(g, P.cx, P.y + 35, n.l, "lbl t-trigger");
      lines(g, P.cx, P.y + 51, n.s, "sub t-trigger-sub");
    } else if (n.t === "split") {
      const k = 16, { x, y, w, h } = P;
      el("polygon", { points: `${x + k},${y} ${x + w - k},${y} ${x + w},${y + h / 2} ${x + w - k},${y + h} ${x + k},${y + h} ${x},${y + h / 2}`, class: "n-split" }, g);
      if (n.two) { text(g, P.cx, P.cy - 3, n.l, "lbl t-split"); text(g, P.cx, P.cy + 13, n.s, "lbl t-split"); }
      else if (n.s) {
        const sl = n.s.split("|");
        text(g, P.cx, P.cy - (sl.length > 1 ? 12 : 4), n.l, "lbl t-split");
        lines(g, P.cx, P.cy + (sl.length > 1 ? 4 : 12), n.s, "sub", 13);
      } else text(g, P.cx, P.cy + 4, n.l, "lbl t-split");
    } else if (n.t === "wait") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: P.h / 2, class: "n-wait" }, g);
      text(g, P.cx, P.cy + 4, "Wait", "chiptxt t-wait");
    } else if (n.t === "hold") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 9, class: "n-hold" }, g);
      text(g, P.cx, P.y + 24, n.l, "lbl");
      text(g, P.cx, P.y + 41, n.s, "sub");
    } else if (n.t === "goal") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: P.h / 2, class: "n-goal" }, g);
      text(g, P.cx, P.y + 22, "GOAL", "kicker t-goal-sub");
      text(g, P.cx, P.y + 39, n.l, "lbl t-goal");
    } else if (n.t === "msg") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 9, class: "n-msg" }, g);
      const label = { email: "EMAIL", push: "PUSH", store: "STORE" }[n.ch], cw = label.length * 7 + 14;
      el("rect", { x: P.x + 10, y: P.y + 10, width: cw, height: 17, rx: 4, class: `c-${n.ch}` }, g);
      text(g, P.x + 10 + cw / 2, P.y + 22, label, `chiptxt ct-${n.ch}`);
      text(g, P.x + 12, P.y + 46, n.l, "lbl", "start");
      text(g, P.x + 12, P.y + 62, n.s || "", "sub", "start");
    } else if (n.t === "stage") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: P.h / 2, class: "n-stage" }, g);
      text(g, P.cx, P.cy + 4.5, n.l, "lbl t-stage");
    } else if (n.t === "journey") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 9, class: "n-journey" }, g);
      text(g, P.cx, P.y + 24, n.l, "lbl");
      lines(g, P.cx, P.y + 41, n.s, "sub");
    } else if (n.t === "band") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 9, class: "n-band" }, g);
      text(g, P.cx, P.cy + 4.5, n.l, "lbl t-band");
    }
  });
  return svg;
}


/* ---- workflow-builder renderer (capstone) ---- */
const KIND = {
  trigger:{tile:"b-trig", icon:"bolt"}, split:{tile:"b-split", icon:"fork"}, hold:{tile:"b-hold", icon:"stop"},
  person:{tile:"b-person", icon:"sliders"}, push:{tile:"b-push", icon:"phone"}, email:{tile:"b-email", icon:"mail"},
  wait:{tile:"b-wait", icon:"clock"}, goal:{tile:"b-goal", icon:"flag"}, store:{tile:"b-store", icon:"user"}
};
function icon(g, name, x, y) {
  const s = (d, extra = {}) => el("path", Object.assign({ d, class: "glyph" }, extra), g);
  const cx = x + 17, cy = y + 17;
  if (name === "bolt") s(`M${cx+2},${cy-9} L${cx-5},${cy+1} H${cx} L${cx-2},${cy+9} L${cx+5},${cy-1} H${cx} Z`, { class: "glyph fillg" });
  if (name === "fork") { s(`M${cx},${cy+8} V${cy} M${cx},${cy} L${cx-6},${cy-7} M${cx},${cy} L${cx+6},${cy-7}`); }
  if (name === "stop") { el("circle", { cx, cy, r: 7.5, class: "glyph" }, g); s(`M${cx-4},${cy} H${cx+4}`); }
  if (name === "sliders") s(`M${cx-7},${cy-5} H${cx+7} M${cx-7},${cy+5} H${cx+7} M${cx+2},${cy-8} V${cy-2} M${cx-3},${cy+2} V${cy+8}`);
  if (name === "phone") { el("rect", { x: cx-5.5, y: cy-9, width: 11, height: 18, rx: 2.5, class: "glyph" }, g); s(`M${cx-1.5},${cy+5.5} H${cx+1.5}`); }
  if (name === "mail") { el("rect", { x: cx-8, y: cy-6, width: 16, height: 12, rx: 2, class: "glyph" }, g); s(`M${cx-8},${cy-5} L${cx},${cy+1} L${cx+8},${cy-5}`); }
  if (name === "clock") { el("circle", { cx, cy, r: 8, class: "glyph" }, g); s(`M${cx},${cy-4.5} V${cy} L${cx+3.5},${cy+2.5}`); }
  if (name === "flag") s(`M${cx-6},${cy+9} V${cy-8} H${cx+6} L${cx+3},${cy-4} L${cx+6},${cy} H${cx-6}`);
  if (name === "user") { el("circle", { cx, cy: cy-3.5, r: 3.8, class: "glyph" }, g); s(`M${cx-7},${cy+8} C${cx-6},${cy+1} ${cx+6},${cy+1} ${cx+7},${cy+8}`); }
}
function renderBuilder(d) {
  const pad = 32, CW = 236, CH = 70, colStep = 262, levelStep = 112;
  const cols = Math.max(...d.nodes.map(n => n.c)) + 1;
  const W = pad * 2 + CW + (cols - 1) * colStep;
  const maxL = Math.max(...d.nodes.map(n => n.l));
  const H = pad * 2 + maxL * levelStep + CH;
  const pos = {};
  d.nodes.forEach(n => {
    const small = n.k === "exit" || n.k === "loop";
    const w = small ? (n.k === "loop" ? 210 : 150) : (n.w || CW), h = small ? 34 : CH;
    const cx = pad + CW / 2 + n.c * colStep, cy = pad + CH / 2 + n.l * levelStep;
    pos[n.id] = { x: cx - w / 2, y: cy - h / 2, w, h, cx, cy };
  });
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": d.title });
  svg.style.maxWidth = W + "px";
  const defs = el("defs", {}, svg);
  const f = el("filter", { id: "card-shadow", x: "-10%", y: "-20%", width: "120%", height: "150%" }, defs);
  el("feDropShadow", { dx: 0, dy: 1.5, stdDeviation: 2.2, class: "shadow" }, f);
  const mk = el("marker", { id: "ar-b", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6.5, markerHeight: 6.5, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", class: "arrow" }, mk);

  const eg = el("g", {}, svg), pills = el("g", {}, svg);
  d.edges.forEach(([a, b, label, merge]) => {
    const A = pos[a], B = pos[b], y1 = A.y + A.h, y2 = B.y - 2; let p;
    if (Math.abs(A.cy - B.cy) < 1) {
      const x1 = A.x + A.w, x2 = B.x - 2;
      el("path", { d: `M${x1},${A.cy} H${x2}`, class: "b-edge", "marker-end": "url(#ar-b)" }, eg);
      if (label) { const tw = label.length * 6.6 + 18, mx = (x1 + x2) / 2;
        el("rect", { x: mx - tw / 2, y: A.cy - 10, width: tw, height: 20, rx: 10, class: "b-pill" }, pills);
        text(pills, mx, A.cy + 4, label, "b-pilltxt"); }
      return;
    }
    if (Math.abs(A.cx - B.cx) < 1) p = `M${A.cx},${y1} V${y2}`;
    else { const turn = merge ? B.y - 22 : y1 + 22; p = `M${A.cx},${y1} V${turn} H${B.cx} V${y2}`; }
    el("path", { d: p, class: "b-edge", "marker-end": "url(#ar-b)" }, eg);
    const segTop = Math.abs(A.cx - B.cx) < 1 ? y1 : (merge ? B.y - 22 : y1 + 22);
    const my = (segTop + B.y) / 2;
    if (label) {
      const tw = label.length * 6.6 + 18;
      el("rect", { x: B.cx - tw / 2, y: my - 10, width: tw, height: 20, rx: 10, class: "b-pill" }, pills);
      text(pills, B.cx, my + 4, label, "b-pilltxt");
    } else if (Math.abs(A.cx - B.cx) < 1 && B.y - y1 > 30) {
      el("circle", { cx: B.cx, cy: my, r: 7, class: "b-plus" }, pills);
      el("path", { d: `M${B.cx-3},${my} H${B.cx+3} M${B.cx},${my-3} V${my+3}`, class: "b-plusg" }, pills);
    }
  });

  d.nodes.forEach(n => {
    const P = pos[n.id], g = el("g", {}, svg);
    if (n.k === "exit" || n.k === "loop") {
      el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: P.h / 2, class: n.k === "loop" ? "b-loop" : "b-exit" }, g);
      text(g, P.cx, P.cy + 4, (n.k === "loop" ? "↺  " : "") + n.title, n.k === "loop" ? "b-looptxt" : "b-exittxt");
      return;
    }
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 8, class: "b-card" + (n.k === "trigger" ? " b-card-trig" : n.k === "goal" ? " b-card-goal" : ""), filter: "url(#card-shadow)" }, g);
    const K = KIND[n.k];
    el("rect", { x: P.x + 12, y: P.y + 18, width: 34, height: 34, rx: 7, class: K.tile }, g);
    icon(g, K.icon, P.x + 12, P.y + 18);
    text(g, P.x + 58, P.y + 22, n.type.toUpperCase(), "b-type", "start");
    text(g, P.x + 58, P.y + 41, n.title, "b-title", "start");
    text(g, P.x + 58, P.y + 57, n.sub, "b-sub", "start");
  });
  return svg;
}

const host = document.getElementById("frames");
DIAGRAMS.forEach(d => {
  const f = document.createElement("section"); f.className = "frame"; f.id = d.id;
  f.innerHTML = `<div class="frame-head"><div><h2></h2><p></p></div><div class="chips"></div></div><div class="canvas"></div>`;
  f.querySelector("h2").textContent = d.title;
  f.querySelector("p").textContent = d.sub;
  const chips = f.querySelector(".chips");
  d.chips.forEach(c => { const s = document.createElement("span"); s.className = "chip" + (c.goal ? " goal" : "") + (c.blue ? " blue" : ""); s.textContent = c.t; chips.appendChild(s); });
  f.querySelector(".canvas").appendChild(d.builder ? renderBuilder(d) : render(d));
  if (d.foot) { const p = document.createElement("p"); p.className = "foot"; p.textContent = d.foot; f.appendChild(p); }
  host.appendChild(f);
});
</script>
